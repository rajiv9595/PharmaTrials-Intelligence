services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmatrials-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharma_trials
      POSTGRES_USER: pharma_user
      POSTGRES_PASSWORD: pharma_password
    ports:
      - "5432:5432"
    volumes:
      - pharmatrials_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma_user -d pharma_trials"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pharmatrials_pgdata:
